<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Resonansi Keluarga · Asesmen Digital Parenting</title>
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #F9F3E2 0%, #FEE9D6 100%);
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main card */
        .app-card {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 245, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1), 0 2px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .header {
            background: #1A6F6B;
            padding: 1.8rem 1.5rem;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header h1 i {
            font-size: 2rem;
            color: #E8B34B;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 8px;
        }

        .progress-container {
            padding: 1rem 1.5rem;
            background: #FFF4E6;
            border-bottom: 1px solid #FFE0B5;
        }

        .step-info {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.85rem;
            color: #5B6E6A;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background: #E0D6C8;
            border-radius: 40px;
            height: 8px;
            overflow: hidden;
        }

        .progress-fill {
            background: #D65C2B;
            width: 0%;
            height: 100%;
            border-radius: 40px;
            transition: width 0.3s ease;
        }

        .content {
            padding: 1.8rem 1.5rem;
        }

        .role-badge {
            background: #F0E3D0;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 60px;
            font-weight: 600;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            color: #2D3E3B;
        }

        .role-badge i {
            margin-right: 6px;
            color: #D65C2B;
        }

        .question-item {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #FFEFDD;
            transition: all 0.2s;
        }

        .question-text {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #2D3E3B;
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-choice {
            flex: 1;
            padding: 10px 0;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background: #F4F0EA;
            color: #4A5C58;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-choice.active-sudah {
            background: #1A6F6B;
            color: white;
            box-shadow: 0 4px 10px rgba(26,111,107,0.3);
        }

        .btn-choice.active-belum {
            background: #D65C2B;
            color: white;
            box-shadow: 0 4px 10px rgba(214,92,43,0.25);
        }

        .btn-choice i {
            font-size: 1rem;
        }

        .btn-next {
            background: #D65C2B;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 1.8rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-next:disabled {
            background: #CBBBA8;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid #D65C2B;
            color: #D65C2B;
            margin-top: 12px;
        }

        .result-container {
            background: #FEF8EE;
            border-radius: 28px;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .score-circle {
            background: #1A6F6B;
            width: 100px;
            height: 100px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: white;
            font-weight: 800;
            font-size: 2.2rem;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
        }

        .insight-text {
            line-height: 1.5;
            margin: 1rem 0;
            text-align: center;
        }

        .detail-breakdown {
            background: #FFF;
            border-radius: 24px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .family-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #F0E3D0;
        }

        @media (max-width: 500px) {
            .app-card {
                border-radius: 32px;
            }
            .content {
                padding: 1.2rem;
            }
            .question-text {
                font-size: 0.95rem;
            }
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 1rem;
            color: #9E8D78;
            border-top: 1px solid #F0E3D0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="app-card" id="app">
    <div class="header">
        <h1><i class="fas fa-circle-nodes"></i> Resonansi Keluarga</h1>
        <p>Asesmen Digital Parenting · Ayah, Bunda & Anak</p>
    </div>

    <div class="progress-container" id="progressArea">
        <div class="step-info">
            <span id="stepLabel">Langkah 1 dari 3</span>
            <span id="roleName">Ayah</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="content" id="mainContent">
        <!-- Dynamic content will be injected -->
    </div>
    <footer>
        <i class="fas fa-mobile-alt"></i> Setiap pilihan membantu keluarga menemukan keseimbangan digital
    </footer>
</div>

<script>
    // ----- DATA PERNYATAAN UNTUK SETIAP PERAN -----
    const questionsData = {
        ayah: [
            "Saya membatasi waktu layar anak maksimal 2 jam per hari.",
            "Saya bermain atau bercengkerama dengan anak tanpa gadget setiap hari.",
            "Saya memberi contoh dengan tidak menggunakan ponsel saat makan malam.",
            "Saya dan anak membuat kesepakatan penggunaan gawai bersama."
        ],
        bunda: [
            "Saya mendampingi anak saat menggunakan internet untuk belajar.",
            "Saya mengajak anak melakukan aktivitas fisik di luar rumah tanpa layar.",
            "Saya menetapkan 'zona bebas gadget' di kamar tidur anak.",
            "Saya rutin berdiskusi dengan anak tentang konten digital yang sehat."
        ],
        anak: [
            "Saya mematikan notifikasi HP saat belajar atau tidur.",
            "Saya bermain di luar atau membaca buku tanpa minta gawai.",
            "Saya memberi tahu orang tua jika melihat hal yang aneh di internet.",
            "Saya membantu mengingatkan orang tua untuk tidak terlalu lama main HP."
        ]
    };

    // State aplikasi
    let currentRoleIndex = 0;      // 0: ayah, 1: bunda, 2: anak
    const roles = ["ayah", "bunda", "anak"];
    // Menyimpan jawaban: { ayah: [boolean], bunda: [boolean], anak: [boolean] }
    let answers = {
        ayah: new Array(questionsData.ayah.length).fill(null),
        bunda: new Array(questionsData.bunda.length).fill(null),
        anak: new Array(questionsData.anak.length).fill(null)
    };

    // Fungsi untuk merender tampilan kuesioner peran saat ini
    function renderCurrentRole() {
        const roleKey = roles[currentRoleIndex];
        const questions = questionsData[roleKey];
        const currentAnswers = answers[roleKey];
        const roleDisplayName = roleKey === "ayah" ? "Ayah" : (roleKey === "bunda" ? "Bunda" : "Anak");
        const stepNumber = currentRoleIndex + 1;

        // Update progress bar & label
        document.getElementById("stepLabel").innerText = `Langkah ${stepNumber} dari 3`;
        document.getElementById("roleName").innerHTML = `<i class="fas ${roleKey === 'ayah' ? 'fa-user-check' : (roleKey === 'bunda' ? 'fa-hands-helping' : 'fa-child')}"></i> ${roleDisplayName}`;
        const progressPercent = (stepNumber / 3) * 100;
        document.getElementById("progressFill").style.width = `${progressPercent}%`;

        // Bangun HTML
        let html = `<div class="role-badge"><i class="fas fa-pen-fancy"></i> ${roleDisplayName}, jawab jujur ya</div>`;
        questions.forEach((q, idx) => {
            const selectedVal = currentAnswers[idx];
            let sudahActive = (selectedVal === true) ? 'active-sudah' : '';
            let belumActive = (selectedVal === false) ? 'active-belum' : '';
            html += `
                <div class="question-item" data-qidx="${idx}">
                    <div class="question-text">${q}</div>
                    <div class="button-group">
                        <button class="btn-choice ${sudahActive}" data-choice="sudah" data-qidx="${idx}">
                            <i class="fas fa-check-circle"></i> SUDAH
                        </button>
                        <button class="btn-choice ${belumActive}" data-choice="belum" data-qidx="${idx}">
                            <i class="fas fa-times-circle"></i> BELUM
                        </button>
                    </div>
                </div>
            `;
        });
        // Tombol lanjut
        const allAnswered = currentAnswers.every(v => v !== null);
        html += `<button class="btn-next" id="nextBtn" ${!allAnswered ? 'disabled' : ''}>
                    <i class="fas fa-arrow-right"></i> ${currentRoleIndex === 2 ? 'Lihat Hasil Keluarga' : 'Simpan & Lanjut'}
                 </button>`;
        if (currentRoleIndex > 0 || (currentRoleIndex === 0 && Object.values(answers).some(r => r.some(v=>v!==null)))) {
            // tambah tombol reset opsional? nanti di bagian hasil saja
        }
        document.getElementById("mainContent").innerHTML = html;

        // Attach event listeners untuk tombol pilihan
        document.querySelectorAll('.btn-choice').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const qIdx = parseInt(btn.getAttribute('data-qidx'));
                const choice = btn.getAttribute('data-choice');
                const isSudah = (choice === 'sudah');
                // update state answers
                answers[roleKey][qIdx] = isSudah;
                // re-render untuk update visual tombol aktif
                renderCurrentRole();
            });
        });

        // Tombol lanjut
        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) {
            nextBtn.addEventListener('click', () => {
                // Pastikan semua sudah dijawab (tapi tombol disabled jika belum, tetap cek)
                const currentAns = answers[roleKey];
                if (currentAns.every(v => v !== null)) {
                    if (currentRoleIndex === 2) {
                        // Tampilkan hasil akhir
                        showFinalResult();
                    } else {
                        // Pindah ke role berikutnya
                        currentRoleIndex++;
                        renderCurrentRole();
                    }
                } else {
                    alert("Harap jawab semua pernyataan dengan SUDAH atau BELUM terlebih dahulu.");
                }
            });
        }
    }

    // Fungsi hitung skor total dan breakdown
    function computeScores() {
        let totalCorrect = 0;
        let totalMax = 0;
        let perRoleScore = { ayah: 0, bunda: 0, anak: 0 };
        let perRoleMax = { ayah: questionsData.ayah.length, bunda: questionsData.bunda.length, anak: questionsData.anak.length };
        
        for (let role of roles) {
            let roleAnswers = answers[role];
            let roleScore = 0;
            for (let i = 0; i < roleAnswers.length; i++) {
                if (roleAnswers[i] === true) roleScore++;
            }
            perRoleScore[role] = roleScore;
            totalCorrect += roleScore;
            totalMax += perRoleMax[role];
        }
        return { totalCorrect, totalMax, perRoleScore, perRoleMax };
    }

    // Generate insight berdasarkan skor dan pola jawaban
    function generateInsight(totalScore, maxScore, perRoleScore) {
        const percentage = (totalScore / maxScore) * 100;
        let insightMain = "";
        let recommendation = "";

        if (percentage >= 75) {
            insightMain = "🌟 Luar biasa! Keluarga Anda sudah memiliki fondasi digital parenting yang kuat. Anak merasa diperhatikan dan batasan teknologi berjalan sehat.";
            recommendation = "💡 Pertahankan kebiasaan baik ini. Coba adakan 'Family Digital Day' seminggu sekali tanpa gawai sama sekali, dan ajak anak berbagi cerita tentang dunia online mereka.";
        } else if (percentage >= 50) {
            insightMain = "🌱 Keluarga Anda di jalur yang baik, tetapi masih ada ruang untuk meningkatkan konsistensi. Beberapa kebiasaan digital perlu diperkuat bersama.";
            recommendation = "💡 Mulai dari satu komitmen kecil: misalnya '15 menit quality time tanpa layar sebelum tidur'. Libatkan anak membuat aturan main gadget.";
        } else if (percentage >= 25) {
            insightMain = "⚠️ Keluarga Anda menghadapi tantangan signifikan dalam keseimbangan digital. Tidak apa-apa, ini awal perubahan positif.";
            recommendation = "💡 Prioritaskan 2-3 kebiasaan sederhana: jadwalkan makan malam tanpa HP, dan diskusikan dengan anak tentang durasi bermain game. Libatkan Ayah & Bunda secara bergantian.";
        } else {
            insightMain = "🛡️ Keluarga Anda sangat membutuhkan intervensi ramah dalam digital parenting. Jangan khawatir, banyak keluarga yang memulai dari sini.";
            recommendation = "💡 Mulai dengan 'zona bebas gadget' di meja makan selama 30 menit setiap hari. Gunakan timer visual untuk anak. Ayah dan Bunda harus menjadi teladan pertama.";
        }

        // Tambahan spesifik per peran
        let roleAdvice = "";
        if (perRoleScore.ayah < (questionsData.ayah.length / 2)) roleAdvice += "👨‍👧 Ayah: coba tingkatkan keteladanan dalam membatasi gawai. ";
        if (perRoleScore.bunda < (questionsData.bunda.length / 2)) roleAdvice += "👩‍👦 Bunda: diskusi rutin tentang konten digital sangat membantu. ";
        if (perRoleScore.anak < (questionsData.anak.length / 2)) roleAdvice += "🧒 Anak: ajak orang tua membuat jadibelajar-bermain bersama! ";

        return { insightMain, recommendation, roleAdvice };
    }

    function showFinalResult() {
        const { totalCorrect, totalMax, perRoleScore } = computeScores();
        const { insightMain, recommendation, roleAdvice } = generateInsight(totalCorrect, totalMax, perRoleScore);
        
        const roleNames = { ayah: "Ayah", bunda: "Bunda", anak: "Anak" };
        let breakdownHtml = `<div class="detail-breakdown"><h4 style="margin-bottom:12px;"><i class="fas fa-chart-simple"></i> Skor per Peran</h4>`;
        for (let role of roles) {
            let score = perRoleScore[role];
            let maxQ = questionsData[role].length;
            let percent = Math.round((score/maxQ)*100);
            breakdownHtml += `
                <div class="family-row">
                    <span><i class="fas ${role === 'ayah' ? 'fa-user' : (role === 'bunda' ? 'fa-female' : 'fa-child')}"></i> ${roleNames[role]}</span>
                    <span><strong>${score}/${maxQ}</strong> (${percent}%)</span>
                </div>
            `;
        }
        breakdownHtml += `</div>`;

        const totalPercent = Math.round((totalCorrect/totalMax)*100);
        const resultHtml = `
            <div class="result-container">
                <div class="score-circle">
                    ${totalCorrect}/${totalMax}
                </div>
                <div style="text-align:center; font-weight:600; margin-bottom:4px;">Skor Keluarga: ${totalPercent}%</div>
                <div class="insight-text">
                    <p>${insightMain}</p>
                    <p style="margin-top:12px; background:#FFF0E0; padding:10px; border-radius:24px;">${recommendation}</p>
                    ${roleAdvice ? `<p style="margin-top:12px;"><i class="fas fa-lightbulb"></i> ${roleAdvice}</p>` : ''}
                </div>
                ${breakdownHtml}
                <button class="btn-next" id="resetAllBtn" style="background:#1A6F6B; margin-top:20px;">
                    <i class="fas fa-sync-alt"></i> Mulai Asesmen Ulang
                </button>
            </div>
        `;

        document.getElementById("mainContent").innerHTML = resultHtml;
        // Sembunyikan progress bar atau tidak perlu? Biar tetap tapi opsional
        document.getElementById("progressFill").style.width = "100%";
        document.getElementById("stepLabel").innerHTML = "Selesai";
        document.getElementById("roleName").innerHTML = "Hasil Keluarga";
        
        // event reset
        const resetBtn = document.getElementById("resetAllBtn");
        if (resetBtn) {
            resetBtn.addEventListener("click", () => {
                // reset semua state
                answers = {
                    ayah: new Array(questionsData.ayah.length).fill(null),
                    bunda: new Array(questionsData.bunda.length).fill(null),
                    anak: new Array(questionsData.anak.length).fill(null)
                };
                currentRoleIndex = 0;
                renderCurrentRole();
                // reset progress fill ke 0
                document.getElementById("progressFill").style.width = "0%";
            });
        }
    }

    // Inisialisasi
    renderCurrentRole();
</script>
</body>
</html>
